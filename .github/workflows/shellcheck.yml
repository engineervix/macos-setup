name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "scripts/*.sh"
      - ".github/workflows/shellcheck.yml"
      - ".shellcheckrc"
  pull_request:
    branches: [main]
    paths:
      - "install.sh"
      - "scripts/*.sh"
      - ".github/workflows/shellcheck.yml"
      - ".shellcheckrc"
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          format: gcc
          # conf/zshrc is a zsh script; shellcheck has no zsh dialect and
          # misparses zsh-only syntax (e.g. ${(s.:.)VAR}) as hard errors.
          # Lint it manually with `shellcheck conf/zshrc` instead.
          ignore_names: zshrc

      - name: ShellCheck Results
        if: failure()
        run: |
          echo "ShellCheck found issues in the shell scripts."
          echo "Please review and fix the issues before merging."
          exit 1
