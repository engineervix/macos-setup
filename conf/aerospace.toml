# =============================================================================
# AeroSpace config — mirrors Hyprland keybindings ($mainMod = Caps Lock, held)
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# The modifier is Cmd+Ctrl+Option (cmd-ctrl-alt- below), sent by holding Caps
# Lock — see conf/karabiner/karabiner.json. Plain Alt alone is deliberately
# left untouched here: it collided with several terminal tools that also
# default to Alt-based bindings (fzf's Alt-C cd-picker, forgit's Alt-E/W/K/P,
# macOS's own Option+letter special characters). Shift stays a free 5th
# modifier, exactly as before, so cmd-ctrl-alt-h (focus) and
# cmd-ctrl-alt-shift-h (move) remain distinct.
# =============================================================================

config-version = 2

after-login-command = []
after-startup-command = [
    # SketchyBar detects if already running, so safe to always include
    'exec-and-forget sketchybar',
    # JankyBorders — config in ~/.config/borders/bordersrc
    'exec-and-forget borders',
]

# Notify SketchyBar when the active workspace changes.
# FOCUSED_WORKSPACE must match the env var read by the SketchyBar aerospace plugin.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

# Mouse warps to centre only when switching monitors (avoids disruptive mid-window teleport on keyboard nav)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Prevent accidentally hidden apps from disappearing behind tiled windows
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

# Gaps mirror Hyprland: gaps_in = 5, gaps_out = 10
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
# Per-monitor top gap = Y_OFFSET + bar_height(30) + breathing_room.
# Keep in sync with BUILTIN_Y_OFFSET / EXTERNAL_Y_OFFSET in display_profile.sh.
#   built-in only:      0 + 30 + 15 = 45  (15px gap — bar is flush, needs more breathing room)
#   external/clamshell: 8 + 30 +  4 = 42  (4px gap — floating bar already has visual separation)
outer.top        = [{ monitor."built-in" = 45 }, 42]
outer.right      = 10

# =============================================================================
# Main binding mode
# =============================================================================
[mode.main.binding]

# Suppress "hide application" — hits by accident constantly
cmd-h     = []
cmd-alt-h = []

# --- Launch & close ---
cmd-ctrl-alt-q = 'exec-and-forget open -a Kitty'    # Super+Q → terminal
cmd-ctrl-alt-c = 'close'                             # Super+C → kill window
# osascript workaround — AeroSpace cannot invoke Spotlight directly
cmd-ctrl-alt-r = 'exec-and-forget osascript -e "tell application \"System Events\" to keystroke space using {command down}"'  # Super+R → Spotlight
cmd-ctrl-alt-e = 'exec-and-forget open -a Finder'   # Super+E → file manager

# --- Screenshot to clipboard (mirrors Super+Print → grim -g slurp | wl-copy) ---
cmd-ctrl-alt-shift-s = 'exec-and-forget screencapture -i -c'

# --- Layout ---
cmd-ctrl-alt-v = 'layout floating tiling'           # Super+V → toggle float
cmd-ctrl-alt-p = 'layout tiles horizontal vertical' # Super+P → h_tiles ↔ v_tiles (multi-arg: applies first non-matching layout; falls back to tiles when in accordion)

# --- Focus ---
cmd-ctrl-alt-h     = 'focus left'
cmd-ctrl-alt-j     = 'focus down'
cmd-ctrl-alt-k     = 'focus up'
cmd-ctrl-alt-l     = 'focus right'
# alt+up/down only — left/right omitted to preserve macOS Option+Arrow word-navigation
cmd-ctrl-alt-down  = 'focus down'
cmd-ctrl-alt-up    = 'focus up'

# --- Move windows ---
cmd-ctrl-alt-shift-h     = 'move left'
cmd-ctrl-alt-shift-j     = 'move down'
cmd-ctrl-alt-shift-k     = 'move up'
cmd-ctrl-alt-shift-l     = 'move right'
cmd-ctrl-alt-shift-down  = 'move down'
cmd-ctrl-alt-shift-up    = 'move up'

# --- Workspaces (alt+1-0) ---
cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'
cmd-ctrl-alt-6 = 'workspace 6'
cmd-ctrl-alt-7 = 'workspace 7'
cmd-ctrl-alt-8 = 'workspace 8'
cmd-ctrl-alt-9 = 'workspace 9'
cmd-ctrl-alt-0 = 'workspace 10'

# --- Move window to workspace and follow (alt+shift+1-0) ---
cmd-ctrl-alt-shift-1 = ['move-node-to-workspace 1',  'workspace 1']
cmd-ctrl-alt-shift-2 = ['move-node-to-workspace 2',  'workspace 2']
cmd-ctrl-alt-shift-3 = ['move-node-to-workspace 3',  'workspace 3']
cmd-ctrl-alt-shift-4 = ['move-node-to-workspace 4',  'workspace 4']
cmd-ctrl-alt-shift-5 = ['move-node-to-workspace 5',  'workspace 5']
cmd-ctrl-alt-shift-6 = ['move-node-to-workspace 6',  'workspace 6']
cmd-ctrl-alt-shift-7 = ['move-node-to-workspace 7',  'workspace 7']
cmd-ctrl-alt-shift-8 = ['move-node-to-workspace 8',  'workspace 8']
cmd-ctrl-alt-shift-9 = ['move-node-to-workspace 9',  'workspace 9']
cmd-ctrl-alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# --- Workspace navigation ---
cmd-ctrl-alt-tab       = 'workspace-back-and-forth'                     # Super+Tab → toggle last workspace
cmd-ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next' # send workspace to next monitor

# --- Mode switches ---
cmd-ctrl-alt-w               = 'mode resize'
cmd-ctrl-alt-shift-semicolon = 'mode service'

# =============================================================================
# Resize mode — enter with alt-w, exit with enter/esc
# =============================================================================
[mode.resize.binding]
h     = 'resize width -50'
j     = 'resize height +50'
k     = 'resize height -50'
l     = 'resize width +50'
left  = 'resize width -50'
down  = 'resize height +50'
up    = 'resize height -50'
right = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc   = 'mode main'

# =============================================================================
# Service mode — enter with alt-shift-;, exit with esc
# For less-common operations: reload config, reset layout, join windows
# =============================================================================
[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']          # reset layout
f         = ['layout floating tiling', 'mode main']          # toggle float
backspace = ['close-all-windows-but-current', 'mode main']
cmd-ctrl-alt-shift-h = ['join-with left',  'mode main']
cmd-ctrl-alt-shift-j = ['join-with down',  'mode main']
cmd-ctrl-alt-shift-k = ['join-with up',    'mode main']
cmd-ctrl-alt-shift-l = ['join-with right', 'mode main']

# =============================================================================
# App → workspace assignments — fires on every new window, not only at startup
# =============================================================================

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'
